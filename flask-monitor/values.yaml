replicaCount: 1

image:
  repository: hatif007/flask-monitor
  tag: latest
  pullPolicy: Always

service:
  type: LoadBalancer
  port: 8082
  targetPort: 8082

resources:
  requests:
    cpu: "120m"
    memory: "64Mi"
  limits:
    cpu: "250m"
    memory: "256Mi"

ingress:
  enabled: false
  className: nginx
  host: flask.local